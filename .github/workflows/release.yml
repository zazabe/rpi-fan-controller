name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches Cargo.toml version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as f:
              cargo_version = tomllib.load(f)["package"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{cargo_version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Tag/version mismatch: got tag {tag}, expected {expected_tag} from Cargo.toml"
              )

          print(f"Tag/version match OK: {tag}")
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cross build --locked --release --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          mkdir -p dist/rpi-fan-control-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rpi-fan-control dist/rpi-fan-control-${{ matrix.target }}/
          cp packaging/rpi-fan-control.service dist/rpi-fan-control-${{ matrix.target }}/
          cp packaging/config.toml.example dist/rpi-fan-control-${{ matrix.target }}/
          tar -czf rpi-fan-control-${{ matrix.target }}.tar.gz -C dist rpi-fan-control-${{ matrix.target }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: rpi-fan-control-${{ matrix.target }}.tar.gz
